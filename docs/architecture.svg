<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order flow</title>
  <desc id="description">The browser talks to the Express server and its four routers. Ten library modules use configuration and the JSON store. The numbered checkout trace shows pricing, Khata, inventory, and persistence. The invoice module is highlighted for Issue 1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#53796f"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #142e2a; font-size: 15px }
      .title { font-size: 38px; font-weight: 700 }
      .section { font-size: 20px; font-weight: 700 }
      .name { font-size: 16px; font-weight: 700 }
      .detail { fill: #426058; font-size: 14px }
      .small { font-size: 13px }
      .card { fill: #ffffff; stroke: #bdd1ca; stroke-width: 1.2 }
      .node { fill: #edf5f1; stroke: #c5d7d0 }
      .ticket { fill: #fff1cc; stroke: #b8821c; stroke-width: 1.5 }
      .arrow { fill: none; stroke: #53796f; stroke-width: 1.8; marker-end: url(#arrow) }
      .step { fill: #205b4d }
      .number { fill: #ffffff; font-weight: 700; text-anchor: middle }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f2f7f4"/>
  <text x="36" y="56" class="title">ShopLedger architecture</text>
  <text x="38" y="83" class="detail">Legacy baseline · Node.js and Express point of sale</text>
  <rect x="800" y="41" width="15" height="15" rx="3" class="ticket"/>
  <text x="825" y="54" class="small">Issue #1 · Printed invoice GST and totals</text>

  <rect x="36" y="111" width="250" height="79" rx="10" class="card"/>
  <text x="54" y="142" class="name">Browser UI · public/</text>
  <text x="54" y="166" class="detail">POS, orders, Khata, GST Audit</text>

  <rect x="324" y="111" width="258" height="79" rx="10" class="card"/>
  <text x="342" y="142" class="name">Express · server.js</text>
  <text x="342" y="166" class="detail">Serves public/ · mounts /api routers</text>
  <path d="M286 150H320" class="arrow"/>

  <rect x="620" y="111" width="544" height="79" rx="10" class="card"/>
  <text x="638" y="139" class="name">API routers · routes/</text>
  <text x="638" y="166" class="detail">orders.js · products.js · customers.js · reports.js</text>
  <path d="M582 150H616" class="arrow"/>
  <path d="M453 190V219" class="arrow"/>
  <path d="M892 190V219" class="arrow"/>

  <rect x="36" y="222" width="546" height="428" rx="12" class="card"/>
  <text x="54" y="253" class="section">Business logic · lib/</text>

  <rect x="54" y="269" width="245" height="55" rx="7" class="node"/>
  <text x="68" y="291" class="name">orders.js</text>
  <text x="68" y="312" class="detail">Order records, filters, cancellations</text>
  <rect x="315" y="269" width="249" height="55" rx="7" class="node"/>
  <text x="329" y="291" class="name">inventory.js</text>
  <text x="329" y="312" class="detail">Product lookup and stock changes</text>

  <rect x="54" y="333" width="245" height="55" rx="7" class="node"/>
  <text x="68" y="355" class="name">pricing.js</text>
  <text x="68" y="376" class="detail">Checkout totals and line discounts</text>
  <rect x="315" y="333" width="249" height="55" rx="7" class="node"/>
  <text x="329" y="355" class="name">coupons.js</text>
  <text x="329" y="376" class="detail">Coupon rules, discounts and caps</text>

  <rect x="54" y="397" width="245" height="55" rx="7" class="node"/>
  <text x="68" y="419" class="name">tax.js</text>
  <text x="68" y="440" class="detail">HSN slab and CGST / SGST split</text>
  <rect x="315" y="397" width="249" height="55" rx="7" class="node"/>
  <text x="329" y="419" class="name">ledger.js</text>
  <text x="329" y="440" class="detail">Khata charges and settlements</text>

  <rect x="54" y="461" width="245" height="55" rx="7" class="ticket"/>
  <text x="68" y="483" class="name">invoice.js</text>
  <text x="68" y="504" class="detail">Invoice figures and printable HTML</text>
  <rect x="315" y="461" width="249" height="55" rx="7" class="node"/>
  <text x="329" y="483" class="name">reports.js</text>
  <text x="329" y="504" class="detail">Sales and GST reconciliation</text>

  <rect x="54" y="525" width="245" height="55" rx="7" class="node"/>
  <text x="68" y="547" class="name">dates.js</text>
  <text x="68" y="568" class="detail">Date parsing and comparisons</text>
  <rect x="315" y="525" width="249" height="55" rx="7" class="node"/>
  <text x="329" y="547" class="name">store.js</text>
  <text x="329" y="568" class="detail">JSON persistence and audit log</text>

  <text x="54" y="609" class="detail">Invoice request · server.js → invoice.js → printable HTML</text>
  <text x="54" y="631" class="detail">GST Audit · routes/reports.js → lib/reports.js → invoice.js</text>

  <rect x="620" y="222" width="544" height="530" rx="12" class="card"/>
  <text x="644" y="253" class="section">Placing an order</text>
  <path d="M656 289V704" fill="none" stroke="#c5d7d0" stroke-width="2"/>

  <circle cx="656" cy="291" r="14" class="step"/>
  <text x="656" y="296" class="number">1</text>
  <text x="684" y="289" class="name">Submit the cart</text>
  <text x="684" y="312" class="detail">public/js/app.js → POST /api/orders → routes/orders.js</text>

  <circle cx="656" cy="360" r="14" class="step"/>
  <text x="656" y="365" class="number">2</text>
  <text x="684" y="358" class="name">Load catalog and check stock</text>
  <text x="684" y="381" class="detail">store.read → inventory.find → inventory.check</text>

  <circle cx="656" cy="429" r="14" class="step"/>
  <text x="656" y="434" class="number">3</text>
  <text x="684" y="427" class="name">Validate coupon and calculate the amount due</text>
  <text x="684" y="450" class="detail">coupons.validate → pricing.computeTotals → tax.getRateForItem</text>

  <circle cx="656" cy="498" r="14" class="step"/>
  <text x="656" y="503" class="number">4</text>
  <text x="684" y="496" class="name">Charge the customer’s Khata account, if used</text>
  <text x="684" y="519" class="detail">ledger.chargeOrderToKhata records the debit in memory</text>

  <circle cx="656" cy="567" r="14" class="step"/>
  <text x="656" y="572" class="number">5</text>
  <text x="684" y="565" class="name">Reserve inventory and create the order</text>
  <text x="684" y="588" class="detail">inventory.reserve → orders.add saves line items and totals</text>

  <circle cx="656" cy="636" r="14" class="step"/>
  <text x="656" y="641" class="number">6</text>
  <text x="684" y="634" class="name">Record the audit event and persist</text>
  <text x="684" y="657" class="detail">store.appendAudit → store.write → data/db.json</text>

  <circle cx="656" cy="705" r="14" class="step"/>
  <text x="656" y="710" class="number">7</text>
  <text x="684" y="703" class="name">Return the saved order</text>
  <text x="684" y="726" class="detail">HTTP 201 with the order JSON → browser UI</text>

  <rect x="36" y="677" width="263" height="75" rx="10" class="card"/>
  <text x="54" y="705" class="name">config.js</text>
  <text x="54" y="728" class="detail">Shop settings, HSN and coupon rules</text>
  <rect x="315" y="677" width="267" height="75" rx="10" class="card"/>
  <text x="333" y="705" class="name">data/db.json</text>
  <text x="333" y="728" class="detail">Orders, stock, Khata and audit data</text>
  <path d="M167 676V653" class="arrow"/>
  <path d="M447 650V674" class="arrow"/>
</svg>
